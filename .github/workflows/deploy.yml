name: Deploy to Linux Server

on:
  push:
    branches:
      - Personal  # or your deployment branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up SSH
      uses: webfactory/ssh-agent@v0.8.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

    - name: Pull latest changes and restart service
      run: |
        ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
          set -e
          cd /home/opc/React/Akkountant_v2-Front
          sudo chown -R opc:opc .
          git reset --hard
          git pull origin Personal
          npm i
          npm run build
          sudo rm -rf /var/www/akkountant/
          sudo mv dist/ /var/www/akkountant/
        EOF
